<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar — Maré de Bets</title>
    <meta
      name="description"
      content="Entre na sua conta da Maré de Bets e continue apostando."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- ===================== CABEÇALHO (igual ao da página principal) ===================== -->
    <header class="cabecalho">
      <div class="container cabecalho__conteudo">
        <input type="checkbox" id="menu-toggle" class="menu-toggle" />
        <label for="menu-toggle" class="menu-botao" aria-label="Abrir menu">
          <span></span><span></span><span></span>
        </label>

        <nav class="cabecalho__nav">
          <ul>
            <li><a href="index.html#esportes">Apostas Esportivas</a></li>
            <li><a href="cassino.html">Cassino</a></li>
          </ul>
        </nav>

        <a href="index.html" class="cabecalho__logo">
          <img
            src="assets/img/logo-header.png"
            alt="Maré de Bets"
            class="cabecalho__logo-imagem"
          />
        </a>

        <div class="cabecalho__acoes">
          <a href="registro.html" class="botao botao--contorno">Registrar</a>
          <a href="login.html" class="botao botao--cheio">Entrar</a>
        </div>
      </div>
    </header>

    <!-- ===================== LOGIN ===================== -->
    <main class="registro">
      <section class="registro__arte">
        <img
          src="assets/img/fofodofundo.png"
          alt=""
          class="registro__arte-imagem"
        />
        <div class="registro__arte-texto">
          <h1>Que bom te ver de volta</h1>
          <p>Entre na sua conta e pegue a sua maré.</p>
        </div>
      </section>

      <section class="registro__painel">
        <form class="formulario" action="#" method="post">
          <img
            src="assets/img/logo.png"
            alt="Logo Maré de Bets"
            width="120"
            class="formulario__logo"
          />
          <h2>Entre na sua conta</h2>

          <div class="campo">
            <label for="email">E-mail</label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              placeholder="voce@email.com"
              required
            />
          </div>

          <div class="campo">
            <label for="senha">Senha</label>
            <input
              type="password"
              id="senha"
              name="senha"
              autocomplete="current-password"
              required
            />
          </div>

          <div class="formulario__extras">
            <label class="campo-check">
              <input type="checkbox" name="lembrar" />
              <span>Manter conectado</span>
            </label>
            <a href="#">Esqueci minha senha</a>
          </div>

          <button
            type="submit"
            class="botao botao--cheio botao--grande formulario__enviar"
          >
            Entrar
          </button>

          <p class="formulario__login">
            Ainda não tem conta? <a href="registro.html">Registrar-se</a>
          </p>
        </form>
      </section>
    </main>
  </body>
</html>
